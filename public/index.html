<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vela Command Center</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header>
  <div class="brand">◆ Vela Command Center</div>
  <nav>
    <a class="active" href="#">Beranda</a><a href="#tugas">Tugas</a><a href="#tim">Tim</a><a href="#proyek">Proyek</a><a href="#log">Log</a>
  </nav>
  <div class="user">🟢 Rizky <span id="clock"></span></div>
</header>

<main>
  <section class="stage">
    <canvas id="scene3d"></canvas>
    <div class="greet">
      <h1 id="greetText">Selamat siang, Rizky!</h1>
      <div class="stats-row">
        <div class="stat"><b id="stProg">0</b><span>Task berjalan</span></div>
        <div class="stat"><b id="stDone">0</b><span>Selesai hari ini</span></div>
        <div class="stat"><b id="stTeam">0/0</b><span>Tim online</span></div>
        <div class="stat"><b id="stMsg">0</b><span>Pesan</span></div>
      </div>
    </div>
    <div class="stage-tools">
      <button id="btnTour">Auto-tour</button>
      <button id="btnTop">Overview</button>
      <button id="btnOrbit" class="on">Orbit: on</button>
    </div>
  </section>

  <aside class="panel left">
    <h2>👥 Tim</h2>
    <div id="teamList"></div>
    <div class="compose">
      <select id="toAgent"></select>
      <textarea id="msgBody" rows="2" placeholder="Kirim pesan ke agent..."></textarea>
      <button id="btnSend">Kirim</button>
    </div>
  </aside>

  <aside class="panel right">
    <h2>🖥️ Server &amp; layanan</h2>
    <div class="metric"><span>CPU</span><b id="mCpu">–</b><div class="bar"><i id="bCpu"></i></div></div>
    <div class="metric"><span>RAM</span><b id="mRam">–</b><div class="bar"><i id="bRam"></i></div></div>
    <div class="metric"><span>Disk</span><b id="mDisk">–</b><div class="bar"><i id="bDisk"></i></div></div>
    <div class="metric"><span>Net ↓/↑</span><b id="mNet">–</b></div>
    <div class="metric"><span>Uptime</span><b id="mUp">–</b></div>
    <h2 style="margin-top:14px">📋 Aktivitas</h2>
    <div id="activity"></div>
  </aside>

  <section class="feed" id="log">
    <h2>💬 Feed pesan antar-agent</h2>
    <div id="feed"></div>
  </section>
</main>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/" } }
</script>
<script type="module" src="/js/scene.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
